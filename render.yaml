services:
  - type: web
    name: apitestify
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm run build
    startCommand: NODE_ENV=production npm start
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false          # You will paste this in the Render dashboard
      - key: NODE_ENV
        value: production
